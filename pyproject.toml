[project]
name = "cutplan_agent"
version = "0.1.0"
description = "도면 → 자재목록 → 전개·분할 → 네스팅 → POR 를 수행하는 VLM skill 에이전트"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "ezdxf>=1.4.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
]

[tool.uv]
# cutplan_agent 는 설치하지 않는다. 레포 루트에서 PYTHONPATH=. 를 주고 파일로 실행한다.
package = false

[dependency-groups]
dev = [
    "ruff==0.17.1",
]

[tool.ruff]
# 마크다운 안의 코드 블록은 포맷하지 않는다. skills/ 는 동료 원본과 sha256 이 같아야 한다.
extend-exclude = ["*.md"]

[tool.ruff.lint.flake8-tidy-imports]
# 상대 import 를 금지한다. `uv run ruff check --select I,TID252 .` 로 확인한다.
ban-relative-imports = "all"
