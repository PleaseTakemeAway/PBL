[project]
name = "cutplan_agent"
version = "0.1.0"
description = "도면 → 자재목록 → 전개·분할 → 네스팅 → POR 를 수행하는 VLM skill 에이전트"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.14.0",
    "ezdxf>=1.4.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.4",
]

[tool.uv]
# cutplan_agent 는 설치하지 않는다. 레포 루트에서 PYTHONPATH=. 를 주고 파일로 실행한다.
package = false

[dependency-groups]
dev = [
    "ruff==0.17.1",
]

[tool.ruff]
# 마크다운 안의 코드 블록은 포맷하지 않는다. skills/ 는 동료 원본과 sha256 이 같아야 한다.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# 이 레포가 지키는 규칙. F: 안 쓰는 import·변수 등, I: import 정렬, TID252: 상대 import 금지,
# UP009: coding 선언 금지. ruff 0.17 의 나머지 기본 규칙은 아직 정리하지 않았다.
select = ["F", "I", "TID252", "UP009"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
